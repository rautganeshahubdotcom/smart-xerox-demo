<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Xerox – Live 3D Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      /* Live Animated 3D Background */
      body {
          margin: 0;
          overflow-x: hidden;
          background: linear-gradient(-45deg, #3b82f6, #8b5cf6, #38bdf8, #818cf8);
          background-size: 400% 400%;
          animation: gradientBG 15s ease infinite;
          -webkit-user-select: none; /* Safari */
          -ms-user-select: none; /* IE 10 and IE 11 */
          user-select: none; /* Standard syntax */
      }
      @keyframes gradientBG {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
      }

      /* Floating Background Elements */
      .floating-shape {
          position: fixed;
          background: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(5px);
          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 20px;
          animation: float 10s ease-in-out infinite;
          z-index: 0;
      }
      @keyframes float {
          0%, 100% { transform: translateY(0) rotate(0deg); }
          50% { transform: translateY(-30px) rotate(10deg); }
      }

      .toast {
        @apply fixed inset-x-0 top-4 mx-auto max-w-xs bg-gray-900/90 backdrop-blur text-white text-sm rounded-xl px-4 py-3 shadow-2xl flex items-center space-x-2 opacity-0 transition-opacity duration-300 z-50 font-semibold border border-gray-700;
      }
      .toast.show { @apply opacity-100; }
      
      /* 3D Pushable Buttons */
      input[type="radio"]:checked + div {
          transform: translateY(4px);
          box-shadow: 0 0px 0 0 transparent !important;
          border-color: #3b82f6;
          background-color: #eff6ff;
      }
      .radio-3d {
          box-shadow: 0 4px 0 0 rgba(0,0,0,0.1);
          transition: all 0.15s ease-in-out;
      }

      /* Glassmorphism for the main card */
      .glass-card {
          background: rgba(255, 255, 255, 0.95);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      @media (max-width: 640px) {
          .js-tilt-glare { display: none !important; }
      }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen font-sans p-4 relative">

    <!-- Floating Background Shapes -->
    <div class="floating-shape" style="width: 150px; height: 150px; top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="floating-shape" style="width: 200px; height: 200px; bottom: 15%; right: 5%; animation-delay: 2s; border-radius: 50%;"></div>
    <div class="floating-shape" style="width: 100px; height: 100px; top: 40%; right: 15%; animation-delay: 4s; transform: rotate(45deg);"></div>

    <div id="toast" class="toast hidden"></div>

    <!-- 3D LIVE TILT CARD -->
    <div class="glass-card rounded-[2rem] shadow-[0_30px_60px_-15px_rgba(0,0,0,0.5)] w-full max-w-md sm:max-w-lg p-6 sm:p-8 relative z-10" 
         data-tilt data-tilt-max="4" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.15" data-tilt-perspective="1000">
        
        <!-- Animated Hero Illustration (Fully Cartoon Style) -->
        <div class="text-center relative" style="transform: translateZ(40px);">
            <svg viewBox="0 0 400 250" class="w-full h-40 max-w-[300px] mx-auto drop-shadow-2xl mb-4" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <style>
                        /* Thick cartoon outlines */
                        .stroke-main { stroke: #1e293b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
                        
                        /* Exaggerated squash & stretch bounce */
                        @keyframes bop {
                            0%, 100% { transform: scaleY(1) translateY(0); }
                            50% { transform: scaleY(0.96) translateY(4px); }
                        }
                        
                        /* Eyes look at printer, then back to us */
                        @keyframes lookPupils {
                            0%, 15% { transform: translateX(0); }
                            20%, 80% { transform: translateX(-12px); }
                            85%, 100% { transform: translateX(0); }
                        }
                        
                        /* Blue scanner light sweeps across */
                        @keyframes scanBeam {
                            0%, 25% { transform: translateX(0); opacity: 0; }
                            30% { opacity: 1; }
                            60% { transform: translateX(85px); opacity: 1; }
                            65%, 100% { transform: translateX(85px); opacity: 0; }
                        }
                        
                        /* Paper pops out dynamically */
                        @keyframes paperEject {
                            0%, 50% { transform: scaleX(0); opacity: 0; }
                            60%, 90% { transform: scaleX(1); opacity: 1; }
                            95%, 100% { opacity: 0; }
                        }
                        
                        /* Fast blinking red/green status light */
                        @keyframes lightFlash {
                            0%, 100% { fill: #ef4444; }
                            50% { fill: #22c55e; }
                        }

                        .man-bop { animation: bop 2s infinite; transform-origin: 310px 230px; }
                        .pupils { animation: lookPupils 5s ease-in-out infinite; }
                        .scanner-beam { animation: scanBeam 5s linear infinite; }
                        .status-light { animation: lightFlash 0.5s infinite; }
                        .printed-paper { animation: paperEject 5s ease-out infinite; transform-origin: 190px center; }
                    </style>
                </defs>

                <!-- Floor Line -->
                <line x1="20" y1="230" x2="380" y2="230" class="stroke-main"/>
                
                <!-- ================= PRINTER (LEFT) ================= -->
                <g class="stroke-main">
                    <!-- Base (Chunky & bright) -->
                    <rect x="40" y="110" width="130" height="120" rx="15" fill="#bae6fd"/>
                    <!-- Trays -->
                    <rect x="55" y="140" width="100" height="25" rx="6" fill="#e0f2fe"/>
                    <rect x="55" y="175" width="100" height="25" rx="6" fill="#e0f2fe"/>
                    
                    <!-- Scanner Top -->
                    <rect x="30" y="80" width="150" height="30" rx="10" fill="#7dd3fc"/>
                    <!-- Control Panel (Yellow block) -->
                    <rect x="140" y="60" width="40" height="20" rx="6" fill="#fde047"/>
                    
                    <!-- Glass area & Animated Beam -->
                    <rect x="45" y="90" width="90" height="10" fill="#ffffff" stroke="none"/>
                    <rect x="45" y="90" width="5" height="10" fill="#3b82f6" stroke="none" class="scanner-beam"/>
                    
                    <!-- Blinking Status Light -->
                    <circle cx="160" cy="70" r="5" stroke="none" class="status-light"/>

                    <!-- Paper Output Slot -->
                    <rect x="170" y="145" width="20" height="40" rx="4" fill="#334155"/>
                    
                    <!-- Printed Paper Animation -->
                    <g class="printed-paper">
                        <rect x="190" y="150" width="50" height="30" rx="3" fill="#ffffff"/>
                        <!-- Scribbles on the paper -->
                        <line x1="198" y1="160" x2="232" y2="160" stroke-width="4"/>
                        <line x1="198" y1="170" x2="222" y2="170" stroke-width="4"/>
                    </g>
                </g>

                <!-- ================= MAN (RIGHT SIDE) ================= -->
                <!-- Entire man is in a bouncy group -->
                <g class="man-bop stroke-main">
                    <!-- Standing Legs -->
                    <line x1="290" y1="210" x2="290" y2="230"/>
                    <line x1="330" y1="210" x2="330" y2="230"/>

                    <!-- Big Round Cartoon Body (Red shirt) -->
                    <path d="M250,210 C250,130 370,130 370,210 Z" fill="#fca5a5"/>
                    <!-- Yellow Collar -->
                    <polygon points="295,130 325,130 310,160" fill="#fef08a"/>

                    <!-- Neck -->
                    <rect x="295" y="100" width="30" height="20" fill="#ffedd5"/>

                    <!-- Huge Cartoon Head -->
                    <circle cx="310" cy="80" r="45" fill="#ffedd5"/>
                    
                    <!-- Spiky Cartoon Hair (Yellow/Orange) -->
                    <path d="M260,80 Q250,40 280,20 Q310,40 310,10 Q320,40 340,20 Q360,50 360,80 Q310,40 260,80" fill="#fbbf24"/>
                    <path d="M275,30 L275,10 M345,30 L355,10" stroke-width="4" stroke-linecap="round"/>

                    <!-- Ears -->
                    <circle cx="265" cy="85" r="8" fill="#ffedd5"/>
                    <circle cx="355" cy="85" r="8" fill="#ffedd5"/>

                    <!-- Big White Cartoon Eyes -->
                    <ellipse cx="295" cy="75" rx="12" ry="18" fill="#ffffff"/>
                    <ellipse cx="325" cy="75" rx="12" ry="18" fill="#ffffff"/>

                    <!-- Moving Pupils (Animated group) -->
                    <g class="pupils" stroke="none">
                        <!-- Black Pupils -->
                        <circle cx="295" cy="75" r="5" fill="#000"/>
                        <circle cx="325" cy="75" r="5" fill="#000"/>
                        <!-- White Catchlights -->
                        <circle cx="293" cy="73" r="2" fill="#fff"/>
                        <circle cx="323" cy="73" r="2" fill="#fff"/>
                    </g>

                    <!-- Big Open Smile -->
                    <path d="M295,100 Q310,120 325,100 Z" fill="#ef4444"/>
                    <!-- Pink Tongue inside mouth -->
                    <path d="M302,110 Q310,105 318,110 Z" fill="#fca5a5" stroke="none"/>
                </g>
            </svg>

            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-800 to-purple-800 drop-shadow-sm">Smart Xerox</h1>
            <p class="text-gray-500 font-bold mt-1">Interactive Print Kiosk</p>
        </div>

        <!-- Step indicator -->
        <div class="flex justify-center gap-3 mb-8 mt-6" id="stepIndicator" style="transform: translateZ(20px);">
            <span class="w-4 h-4 rounded-full shadow-inner shadow-gray-400" data-step="1"></span>
            <span class="w-4 h-4 rounded-full shadow-inner shadow-gray-300" data-step="2"></span>
            <span class="w-4 h-4 rounded-full shadow-inner shadow-gray-300" data-step="3"></span>
        </div>

        <!-- Step 1 – Choose / Upload -->
        <div id="step1" class="space-y-6" style="transform: translateZ(30px);">
            <div class="grid grid-cols-2 gap-4">
                <button id="btnUpload" class="flex flex-col items-center p-5 bg-white border-2 border-blue-100 rounded-2xl shadow-[0_6px_0_0_#bfdbfe,0_10px_15px_rgba(0,0,0,0.1)] hover:shadow-[0_4px_0_0_#bfdbfe,0_5px_10px_rgba(0,0,0,0.1)] hover:translate-y-[2px] active:shadow-[0_0px_0_0_transparent] active:translate-y-[6px] transition-all" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-file-arrow-up text-3xl text-blue-500 mb-2 drop-shadow-md"></i>
                    <span class="text-blue-900 font-extrabold">Upload</span>
                    <small class="text-xs text-blue-500 font-bold">PDF / JPG / PNG</small>
                    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" class="hidden" />
                </button>
                
                <button id="btnCamera" class="flex flex-col items-center p-5 bg-white border-2 border-purple-100 rounded-2xl shadow-[0_6px_0_0_#e9d5ff,0_10px_15px_rgba(0,0,0,0.1)] hover:shadow-[0_4px_0_0_#e9d5ff,0_5px_10px_rgba(0,0,0,0.1)] hover:translate-y-[2px] active:shadow-[0_0px_0_0_transparent] active:translate-y-[6px] transition-all" onclick="document.getElementById('cameraInput').click()">
                    <i class="fa-solid fa-camera text-3xl text-purple-500 mb-2 drop-shadow-md"></i>
                    <span class="text-purple-900 font-extrabold">Take Photo</span>
                    <small class="text-xs text-purple-500 font-bold">From camera</small>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
                </button>
            </div>

            <a href="https://wa.me/919004547159?text=Hi%2C%20I%20want%20to%20print%20a%20document." target="_blank" class="flex items-center justify-center space-x-3 bg-gradient-to-r from-[#25D366] to-[#128C7E] text-white py-4 rounded-2xl shadow-[0_6px_0_0_#14532d,0_15px_20px_rgba(22,163,74,0.4)] hover:shadow-[0_4px_0_0_#14532d,0_10px_15px_rgba(22,163,74,0.4)] hover:translate-y-[2px] active:shadow-none active:translate-y-[6px] transition-all mt-6">
                <i class="fa-brands fa-whatsapp text-2xl drop-shadow-md"></i>
                <span class="font-extrabold text-lg drop-shadow-sm">Send via WhatsApp</span>
            </a>

            <div id="uploadStatus" class="hidden text-center text-blue-600 font-bold mt-4 animate-pulse">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing…
            </div>
            <div id="uploadError" class="hidden text-center text-red-600 font-bold mt-4 bg-red-100 py-2 rounded-lg border-2 border-red-200 shadow-inner"></div>
        </div>

        <!-- Step 2 – Settings & Payment -->
        <div id="step2" class="hidden space-y-6" style="transform: translateZ(40px);">
            <div class="flex items-center justify-between bg-white/50 backdrop-blur p-4 rounded-2xl shadow-[inset_0_2px_10px_rgba(0,0,0,0.05),0_5px_15px_rgba(0,0,0,0.05)] border border-white">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div class="bg-white p-3 rounded-xl shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-gray-100">
                        <i class="fa-solid fa-file-pdf text-2xl text-red-500 drop-shadow-sm"></i>
                    </div>
                    <div class="truncate">
                        <p class="text-sm font-extrabold text-gray-800 truncate" id="previewFileName">file.pdf</p>
                        <p class="text-xs font-bold text-gray-500" id="previewPageCount">1 page(s)</p>
                    </div>
                </div>
                <button class="bg-white text-gray-500 hover:text-red-500 w-10 h-10 rounded-xl shadow-[0_3px_0_0_#e5e7eb] active:translate-y-[3px] active:shadow-none transition-all flex justify-center items-center font-bold" onclick="resetFlow()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="settingsForm" class="space-y-5">
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="colorMode" value="bw" checked class="sr-only peer" />
                        <div class="radio-3d p-4 text-center bg-white/80 border-2 border-gray-100 rounded-xl font-bold text-gray-600 backdrop-blur-sm">
                            <i class="fa-solid fa-circle drop-shadow-sm mr-1"></i> B&W (₹2)
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="colorMode" value="color" class="sr-only peer" />
                        <div class="radio-3d p-4 text-center bg-white/80 border-2 border-gray-100 rounded-xl font-bold text-gray-600 backdrop-blur-sm">
                            <i class="fa-solid fa-palette text-pink-500 drop-shadow-sm mr-1"></i> Color (₹10)
                        </div>
                    </label>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="sides" value="single" checked class="sr-only peer" />
                        <div class="radio-3d p-4 text-center bg-white/80 border-2 border-gray-100 rounded-xl font-bold text-gray-600 backdrop-blur-sm">
                            <i class="fa-solid fa-file-alt drop-shadow-sm mr-1"></i> Single Side
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="sides" value="double" class="sr-only peer" />
                        <div class="radio-3d p-4 text-center bg-white/80 border-2 border-gray-100 rounded-xl font-bold text-gray-600 backdrop-blur-sm">
                            <i class="fa-solid fa-file-contract drop-shadow-sm mr-1"></i> Both Sides
                        </div>
                    </label>
                </div>

                <div class="flex gap-4 items-center bg-white/50 p-4 rounded-2xl shadow-[inset_0_2px_8px_rgba(0,0,0,0.05)] border border-white">
                    <div class="flex-1">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Paper</p>
                        <select id="paperSize" class="w-full bg-white border-2 border-gray-100 rounded-xl p-3 font-bold text-gray-700 shadow-sm outline-none focus:border-blue-500 transition cursor-pointer appearance-none">
                            <option value="a4">A4 Standard</option>
                            <option value="letter">Letter</option>
                            <option value="a3">A3 Large</option>
                        </select>
                    </div>
                    <div class="w-24">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 text-center">Copies</p>
                        <input type="number" id="copies" min="1" max="50" value="1" class="w-full bg-white border-2 border-gray-100 rounded-xl p-3 font-black text-gray-800 text-center shadow-sm outline-none focus:border-blue-500 transition" />
                    </div>
                </div>

                <div class="flex items-center gap-4 mt-8 pt-4">
                    <div class="bg-white/80 backdrop-blur px-4 py-3 rounded-2xl shadow-inner border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Total</p>
                        <p class="text-3xl font-black text-blue-700 drop-shadow-sm" id="totalAmount">₹2</p>
                    </div>
                    <button type="submit" id="payBtn" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold text-lg py-4 rounded-2xl shadow-[0_6px_0_0_#1e3a8a,0_15px_25px_rgba(59,130,246,0.5)] hover:shadow-[0_4px_0_0_#1e3a8a,0_10px_15px_rgba(59,130,246,0.5)] hover:translate-y-[2px] active:shadow-none active:translate-y-[6px] transition-all flex items-center justify-center">
                        <span>Pay & Print</span>
                        <i class="fa-solid fa-bolt ml-2 drop-shadow-md"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Step 3 – Success -->
        <div id="step3" class="hidden text-center py-10" style="transform: translateZ(50px);">
            <div class="bg-gradient-to-tr from-green-500 to-emerald-400 text-white w-24 h-24 rounded-[2rem] shadow-[0_8px_0_0_#14532d,0_20px_25px_rgba(34,197,94,0.5)] flex items-center justify-center mx-auto mb-8 transform -rotate-12 animate-pulse transition duration-300">
                <i class="fa-solid fa-check-double text-5xl drop-shadow-md"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 mb-2 drop-shadow-sm">Success!</h2>
            <p class="text-gray-600 font-bold mb-6 bg-white/50 inline-block px-4 py-1 rounded-full">Show this code at the counter.</p>
            <br>
            <div class="bg-gradient-to-br from-gray-900 to-black text-white rounded-3xl py-6 px-10 inline-block shadow-[0_20px_40px_rgba(0,0,0,0.5)] border-t border-l border-gray-600 transform perspective-500 rotateX-12 hover:scale-110 transition duration-500">
                <p class="text-xs uppercase tracking-widest mb-1 text-gray-400 font-bold">Pickup code</p>
                <p class="text-6xl font-black font-mono tracking-wider drop-shadow-[0_0_15px_rgba(255,255,255,0.6)]" id="pickupCodeDisplay">----</p>
            </div>
            <button class="mt-12 bg-white/80 backdrop-blur text-gray-800 font-extrabold py-4 px-8 rounded-2xl shadow-[0_5px_0_0_#d1d5db] border border-white active:translate-y-[5px] active:shadow-none transition-all w-full" onclick="resetFlow()">Print Another Document</button>
        </div>
    </div>

    <!-- Include Vanilla-Tilt for the Live 3D Mouse/Gyroscope interaction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // ==========================================
        // ANTI-COPY & SECURITY MEASURES
        // ==========================================
        // Disable Right-Click
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U (View Source)
        document.addEventListener('keydown', event => {
            if (event.keyCode === 123 || 
               (event.ctrlKey && event.shiftKey && (event.keyCode === 73 || event.keyCode === 74)) || 
               (event.ctrlKey && event.keyCode === 85)) {
                event.preventDefault();
            }
        });

        // ---------- Utility ----------
        const toast = document.getElementById('toast');
        function showToast(msg, isError = false) {
            toast.innerHTML = (isError ? '<i class="fa-solid fa-triangle-exclamation"></i> ' : '<i class="fa-solid fa-circle-check"></i> ') + msg;
            toast.className = 'toast ' + (isError ? 'bg-red-600' : 'bg-gray-900/90');
            toast.classList.remove('hidden');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        // ---------- State ----------
        let tempId = null;
        let pageCount = 1;

        // ---------- Elements ----------
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const uploadStatus = document.getElementById('uploadStatus');
        const uploadError = document.getElementById('uploadError');
        const previewFileName = document.getElementById('previewFileName');
        const previewPageCount = document.getElementById('previewPageCount');
        const totalAmountEl = document.getElementById('totalAmount');
        const payBtn = document.getElementById('payBtn');
        const pickupCodeDisplay = document.getElementById('pickupCodeDisplay');
        const stepIndicator = document.querySelectorAll('#stepIndicator span');

        // ---------- File handling ----------
        async function handleFile(file) {
            if (!file) return;
            if (file.size > 50 * 1024 * 1024) {
                uploadError.textContent = 'File too large (max 50 MB).';
                uploadError.classList.remove('hidden');
                return;
            }
            uploadError.classList.add('hidden');
            uploadStatus.classList.remove('hidden');
            
            document.getElementById('btnUpload').classList.add('pointer-events-none', 'opacity-50');
            document.getElementById('btnCamera').classList.add('pointer-events-none', 'opacity-50');

            const formData = new FormData();
            formData.append('document', file);
            try {
                const resp = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                
                tempId = data.tempId;
                pageCount = data.pageCount;
                previewFileName.textContent = data.fileName;
                previewPageCount.textContent = `${data.pageCount} page(s) detected`;
                updatePricing();
                
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                setActiveStep(2);
            } catch (e) {
                uploadError.textContent = e.message || 'Upload failed.';
                uploadError.classList.remove('hidden');
            } finally {
                uploadStatus.classList.add('hidden');
                document.getElementById('btnUpload').classList.remove('pointer-events-none', 'opacity-50');
                document.getElementById('btnCamera').classList.remove('pointer-events-none', 'opacity-50');
            }
        }

        document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
        document.getElementById('cameraInput').addEventListener('change', e => handleFile(e.target.files[0]));

        // ---------- Pricing ----------
        function updatePricing() {
            const color = document.querySelector('input[name="colorMode"]:checked').value;
            const copiesInput = parseInt(document.getElementById('copies').value) || 1;
            const copies = Math.min(Math.max(copiesInput, 1), 50); 
            
            const rate = color === 'color' ? 10 : 2;
            const total = pageCount * rate * copies;
            totalAmountEl.textContent = `₹${total}`;
        }
        
        document.querySelectorAll('input[name="colorMode"]').forEach(el => el.addEventListener('change', updatePricing));
        document.getElementById('copies').addEventListener('input', updatePricing);

        // ---------- Payment ----------
        document.getElementById('settingsForm').addEventListener('submit', async e => {
            e.preventDefault();
            const originalBtnHtml = payBtn.innerHTML;
            payBtn.disabled = true;
            payBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Connecting...';
            payBtn.classList.add('translate-y-[6px]', 'shadow-[0_0px_0_0_transparent]');
            
            const payload = {
                tempId,
                colorMode: document.querySelector('input[name="colorMode"]:checked').value,
                paperSize: document.getElementById('paperSize').value,
                copies: Math.min(Math.max(parseInt(document.getElementById('copies').value) || 1, 50), 50),
                sides: document.querySelector('input[name="sides"]:checked').value
            };
            try {
                const orderRes = await fetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const order = await orderRes.json();
                if (order.error) throw new Error(order.error);

                const options = {
                    key: order.key,
                    amount: order.amount,
                    currency: order.currency,
                    name: 'Smart Xerox',
                    description: 'Print Order',
                    order_id: order.order_id,
                    handler: async function (response) {
                        try {
                            payBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Verifying...';
                            const verifyRes = await fetch('/api/verify-payment', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature
                                })
                            });
                            const verify = await verifyRes.json();
                            if (verify.success) {
                                pickupCodeDisplay.textContent = verify.pickupCode;
                                step2.classList.add('hidden');
                                step3.classList.remove('hidden');
                                setActiveStep(3);
                            } else {
                                showToast(verify.message || 'Payment verification failed.', true);
                                resetBtn();
                            }
                        } catch (err) {
                            showToast('Server error during verification. Please try again.', true);
                            resetBtn();
                        }
                    },
                    modal: {
                        ondismiss: function() {
                            resetBtn();
                        }
                    },
                    theme: { color: '#2563EB' }
                };
                const rzp = new Razorpay(options);
                rzp.open();
                rzp.on('payment.failed', () => {
                    showToast('Payment failed.', true);
                    resetBtn();
                });
            } catch (err) {
                showToast(err.message || 'Something went wrong.', true);
                resetBtn();
            }

            function resetBtn() {
                payBtn.disabled = false;
                payBtn.innerHTML = originalBtnHtml;
                payBtn.classList.remove('translate-y-[6px]', 'shadow-[0_0px_0_0_transparent]');
            }
        });

        // ---------- Reset ----------
        function resetFlow() {
            tempId = null;
            pageCount = 1;
            document.getElementById('fileInput').value = '';
            document.getElementById('cameraInput').value = '';
            document.getElementById('copies').value = '1';
            document.querySelector('input[name="colorMode"][value="bw"]').checked = true;
            document.querySelector('input[name="sides"][value="single"]').checked = true;
            uploadError.classList.add('hidden');
            step3.classList.add('hidden');
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            setActiveStep(1);
        }

        // ---------- Step indicator ----------
        function setActiveStep(num) {
            stepIndicator.forEach((el, idx) => {
                if (idx + 1 === num) {
                    el.classList.replace('shadow-gray-300', 'bg-gradient-to-r');
                    el.classList.add('from-blue-400', 'to-blue-600', 'shadow-[0_0_10px_rgba(59,130,246,0.8)]');
                } else {
                    el.className = 'w-4 h-4 rounded-full shadow-inner shadow-gray-400 bg-transparent transition-all duration-300';
                }
            });
        }

        setActiveStep(1);
    </script>
</body>
</html>
