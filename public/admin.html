<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xerox Shop – Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .order-card {
            transition: all 0.2s ease-in-out;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.5);
        }
        /* Pulse for new orders */
        @keyframes glowPulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .new-order {
            animation: glowPulse 2s infinite;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg transform rotate-3">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Admin Access</h1>
            <p class="text-slate-400 text-sm mb-6">Enter shop password to view the queue.</p>
            <input type="password" id="adminPassword" placeholder="••••••••" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 mb-4 outline-none focus:border-blue-500 text-center text-lg tracking-widest transition">
            <button onclick="attemptLogin()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-500 transition shadow-lg flex justify-center items-center">
                <span>Unlock Dashboard</span>
                <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
            <p id="loginError" class="text-red-400 text-sm mt-4 hidden bg-red-900/30 py-2 rounded-lg"><i class="fa-solid fa-circle-exclamation"></i> Incorrect password</p>
        </div>
    </div>

    <!-- DASHBOARD (Hidden initially) -->
    <div id="dashboardScreen" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Navbar -->
        <header class="glass-panel border-b border-slate-700/50 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-md">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Print Queue</h1>
                    <p class="text-xs text-slate-400 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-green-500 mr-1.5 animate-pulse"></span> Live connection active
                    </p>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold transition border border-slate-700 flex items-center">
                <i class="fa-solid fa-power-off mr-2"></i> Lock
            </button>
        </header>

        <!-- Main Content (Scrollable) -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <!-- Lifetime Stats Row -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel rounded-2xl p-5 flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total Revenue</p>
                            <h2 class="text-3xl font-black text-green-400" id="statRevenue">₹0</h2>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-green-900/30 flex items-center justify-center text-green-500 text-xl border border-green-800/50">
                            <i class="fa-solid fa-indian-rupee-sign"></i>
                        </div>
                    </div>
                    
                    <div class="glass-panel rounded-2xl p-5 flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total Orders</p>
                            <h2 class="text-3xl font-black text-blue-400" id="statOrders">0</h2>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-blue-900/30 flex items-center justify-center text-blue-500 text-xl border border-blue-800/50">
                            <i class="fa-solid fa-file-invoice"></i>
                        </div>
                    </div>

                    <div class="glass-panel rounded-2xl p-5 flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Pages Printed</p>
                            <h2 class="text-3xl font-black text-purple-400" id="statPages">0</h2>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-purple-900/30 flex items-center justify-center text-purple-500 text-xl border border-purple-800/50">
                            <i class="fa-solid fa-copy"></i>
                        </div>
                    </div>
                </div>

                <!-- Orders Grid -->
                <div>
                    <div class="flex items-center justify-between mb-4 mt-8">
                        <h2 class="text-lg font-bold text-white">Recent Print Jobs</h2>
                        <span class="bg-blue-600/20 text-blue-400 text-xs font-bold px-3 py-1 rounded-full border border-blue-500/30" id="activeOrdersCount">0 Active</span>
                    </div>
                    
                    <div id="ordersContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <!-- Empty State -->
                        <div class="glass-panel rounded-2xl p-10 text-center col-span-full border-dashed border-2 border-slate-700">
                            <i class="fa-solid fa-inbox text-4xl text-slate-600 mb-3"></i>
                            <p class="text-slate-400 font-medium">Waiting for new orders...</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Hidden Audio for new order chime -->
    <audio id="chime" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let adminPassword = '';
        let lastKnownOrderCount = 0;

        async function attemptLogin() {
            adminPassword = document.getElementById('adminPassword').value;
            const btn = event.currentTarget;
            if(btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                const response = await fetch('/api/admin/orders', {
                    headers: { 'x-admin-password': adminPassword }
                });
                
                if (response.ok) {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    document.getElementById('dashboardScreen').classList.add('flex');
                    fetchOrders(true);
                    setInterval(() => fetchOrders(false), 3000); // 3 second polling
                } else {
                    document.getElementById('loginError').classList.remove('hidden');
                    if(btn) btn.innerHTML = '<span>Unlock Dashboard</span><i class="fa-solid fa-arrow-right ml-2"></i>';
                }
            } catch (err) {
                alert("Cannot connect to server.");
                if(btn) btn.innerHTML = '<span>Unlock Dashboard</span><i class="fa-solid fa-arrow-right ml-2"></i>';
            }
        }

        document.getElementById('adminPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });

        async function actionOrder(pickupCode, action) {
            const endpoint = action === 'collect' ? '/api/admin/mark-collected' : '/api/admin/reprint';
            await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
                body: JSON.stringify({ pickupCode })
            });
            fetchOrders(false);
        }

        async function fetchOrders(isFirstLoad) {
            try {
                const response = await fetch('/api/admin/orders', { headers: { 'x-admin-password': adminPassword } });
                if (!response.ok) return;
                
                const data = await response.json();
                const orders = data.orders;
                const stats = data.stats;

                // Update Lifetime Stats
                document.getElementById('statRevenue').textContent = '₹' + stats.revenue;
                document.getElementById('statOrders').textContent = stats.orders;
                document.getElementById('statPages').textContent = stats.pages;

                // Play chime if new order arrives
                const activeOrders = orders.filter(o => o.status !== 'collected');
                document.getElementById('activeOrdersCount').textContent = `${activeOrders.length} Active`;

                if (!isFirstLoad && activeOrders.length > lastKnownOrderCount) {
                    document.getElementById('chime').play().catch(e => console.log('Audio autoplay blocked'));
                }
                lastKnownOrderCount = activeOrders.length;

                const container = document.getElementById('ordersContainer');

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel rounded-2xl p-10 text-center col-span-full border-dashed border-2 border-slate-700">
                            <i class="fa-solid fa-inbox text-4xl text-slate-600 mb-3"></i>
                            <p class="text-slate-400 font-medium">No print jobs yet.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = orders.map((order, idx) => {
                    const timeString = new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const isCollected = order.status === 'collected';
                    const isColor = order.settings.colorMode === 'color';
                    const isNew = idx === 0 && !isFirstLoad && !isCollected; // pulse effect for newest uncollected order

                    let statusUI = '';
                    let actionBtns = '';

                    if (isCollected) {
                        statusUI = `<span class="px-2 py-1 bg-slate-800 text-slate-400 text-xs font-bold rounded-md border border-slate-700"><i class="fa-solid fa-check mr-1"></i> Collected</span>`;
                        actionBtns = `<button onclick="actionOrder('${order.pickupCode}', 'reprint')" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold transition flex items-center border border-slate-700"><i class="fa-solid fa-rotate-right mr-1.5"></i> Reprint</button>`;
                    } else if (order.status === 'printing_completed' || order.status === 'print_queued') {
                        statusUI = `<span class="px-2 py-1 bg-green-900/40 text-green-400 text-xs font-bold rounded-md border border-green-800"><i class="fa-solid fa-print mr-1"></i> Printed</span>`;
                        actionBtns = `
                            <button onclick="actionOrder('${order.pickupCode}', 'collect')" class="flex-1 bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center shadow-lg shadow-green-900/20"><i class="fa-solid fa-check-double mr-1.5"></i> Mark Collected</button>
                            <button onclick="actionOrder('${order.pickupCode}', 'reprint')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-bold transition border border-slate-600" title="Reprint"><i class="fa-solid fa-rotate-right"></i></button>
                        `;
                    } else {
                        statusUI = `<span class="px-2 py-1 bg-yellow-900/40 text-yellow-400 text-xs font-bold rounded-md border border-yellow-800 animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing</span>`;
                        actionBtns = `
                            <button onclick="actionOrder('${order.pickupCode}', 'collect')" class="flex-1 bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center shadow-lg shadow-green-900/20"><i class="fa-solid fa-check-double mr-1.5"></i> Mark Collected</button>
                        `;
                    }

                    return `
                        <div class="glass-panel rounded-2xl p-5 flex flex-col order-card border ${isCollected ? 'opacity-60 border-slate-800' : 'border-slate-700'} ${isNew ? 'new-order' : ''}">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center space-x-4">
                                    <div class="bg-slate-900 text-white font-mono text-xl font-black px-4 py-2 rounded-xl shadow-inner border border-slate-700/50 tracking-widest">
                                        ${order.pickupCode}
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-slate-200 truncate w-40 sm:w-56" title="${order.originalName}">${order.originalName}</p>
                                        <p class="text-xs text-slate-500 font-medium">${timeString} • ₹${order.totalAmount} Paid</p>
                                    </div>
                                </div>
                                <div>${statusUI}</div>
                            </div>
                            
                            <!-- Badges -->
                            <div class="flex flex-wrap gap-2 mb-4">
                                <span class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 text-xs font-semibold border border-slate-700 flex items-center"><i class="fa-solid fa-file-lines mr-1.5"></i> ${order.pageCount} Pages</span>
                                <span class="px-2.5 py-1 rounded ${isColor ? 'bg-pink-900/30 text-pink-400 border-pink-800/50' : 'bg-slate-800 text-slate-300 border-slate-700'} text-xs font-semibold border flex items-center"><i class="fa-solid fa-palette mr-1.5"></i> ${isColor ? 'COLOR' : 'B&W'}</span>
                                <span class="px-2.5 py-1 rounded bg-blue-900/30 text-blue-400 text-xs font-semibold border border-blue-800/50 flex items-center"><i class="fa-solid fa-clone mr-1.5"></i> ${order.settings.copies} Copies</span>
                                <span class="px-2.5 py-1 rounded bg-orange-900/30 text-orange-400 text-xs font-semibold border border-orange-800/50 flex items-center"><i class="fa-solid fa-file-contract mr-1.5"></i> ${order.settings.sides === 'double' ? 'Double' : 'Single'}</span>
                            </div>
                            
                            <div class="mt-auto pt-4 border-t border-slate-700/50 flex space-x-2">
                                ${actionBtns}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("Failed to fetch orders:", err);
            }
        }
    </script>
</body>
</html>
